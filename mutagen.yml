# Mutagen one-way sync: Mac (alpha) -> VM (beta).
#
# Prereqs on Mac:
#   brew install mutagen-io/mutagen/mutagen
#   # Tailscale SSH handles auth (no key copy / password needed once the
#   # Mac is on the same tailnet). Just add a ~/.ssh/config alias, e.g.:
#   #   Host demosys
#   #     HostName 100.121.14.32          (Tailscale IP or MagicDNS name)
#   #     User     demosys
#
# Usage (run from the project root):
#   mutagen project start
#   mutagen sync list -l             # status + conflicts
#   mutagen project terminate
#
# Edits on Mac propagate to the VM within ~1s. `uvicorn --reload` on the
# VM (if you flip it on) picks up .py changes automatically. SPA changes
# require rebuilding on Mac first (`npm run build` + the copy step),
# Mutagen syncs the built artifacts under frontend/demos/<vertical>/.

sync:
  pwdemo:
    alpha: "."
    # SSH alias from ~/.ssh/config (Host demosys, HostName 100.121.14.32,
    # User demosys). The demosys user is a member of the pwdemo group
    # and /opt/pwdemo is setgid + group-writable, so synced files land
    # with the correct ownership for the systemd service to read them.
    beta:  "demosys:/opt/pwdemo"
    mode:  "one-way-replica"
    # Beta-only permissions: files synced to the VM land as group=pwdemo
    # mode 0664 so the systemd service (running as pwdemo) can read them
    # via group permission. demosys is a member of pwdemo so chgrp is
    # allowed. Setting this under configurationBeta (not the top-level
    # permissions block) avoids Mutagen trying to look up the `pwdemo`
    # group on the Mac, which doesn't exist there.
    configurationBeta:
      permissions:
        defaultFileMode: "0664"
        defaultDirectoryMode: "0775"
        defaultGroup: "pwdemo"
    ignore:
      vcs: true
      paths:
        # Toolchain / build artifacts — VM has its own copy.
        - "/.venv"
        - "/.cache"   # pip's cache on the VM (owned by pwdemo, mode 0600 — demosys can't read)
        - "/.local"   # pip's user-install dir on the VM (same reason)
        - "/node_modules"
        - "/prime-mate-restaurant/node_modules"
        - "/prime-mate-clinic/node_modules"
        - "/prime-mate-restaurant/dist"
        - "/prime-mate-clinic/dist"
        - "**/__pycache__"
        - "*.pyc"

        # Per-machine state — NEVER overwrite the VM's copies with
        # local-dev credentials / call recordings / inboxes / PII.
        # These directories EXIST on the VM as the operator uses each
        # demo, but typically do NOT exist on the developer Mac. Without
        # explicit ignores, one-way-replica would delete the VM-side
        # data on the next sync tick.
        - "/data/state.json"
        - "/data/demos/*/calls"
        - "/data/demos/*/snapshot.json"
        - "/data/demos/*/whatsapp_inbox.json"
        - "/data/demos/*/escalation.json"
        # AI-Center Playground ledger + thumbnails (operator Q+A, PII).
        - "/data/demos/*/ai_center"
        - "/data/demos/*/ai_center.json"
        - "/data/demos/*/ai_center.json.tmp"
        # Primewave contacts ledger (operator-managed leads, PII).
        - "/data/demos/*/contacts.json"
        # Primewave WhatsApp inbox (received caller messages, PII).
        - "/data/demos/*/whatsapp_inbox.json"
        # WhatsApp outgoing media uploads (operator-supplied files, PII).
        - "/data/demos/*/whatsapp_outgoing"
        # WhatsApp incoming media decrypt cache (PII).
        - "/data/demos/*/whatsapp_media"
        # WhatsApp voice-note transcript cache (PII).
        - "/data/demos/*/whatsapp_transcripts"
        # WhatsApp auto-responder bot state — per-phone conversation
        # history + captured customer data (PII).
        - "/data/demos/*/whatsapp_bot_state.json"
        # Kitchen AI-History + AI-Rules ledgers (kitchen camera footage).
        - "/data/demos/*/ai_history"
        - "/data/demos/*/ai_history.json"
        - "/data/demos/*/kitchen_rules"
        - "/data/demos/*/kitchen_rules.json"
        # Atomic-write temp files Mutagen would chase during a save.
        - "/data/demos/*/*.json.tmp"
        - "/data/ai_camera"

        # macOS noise.
        - ".DS_Store"

        # Live agent runtime audio dumps.
        - "/data/live_calls"
